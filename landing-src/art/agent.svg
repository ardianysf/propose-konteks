<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" role="img" aria-label="A friendly chat agent seen from the front: a glossy white round head with a dark visor and glowing green eyes, a ring and ball antenna, a round body with a soft green chest panel and floating arms, one of them waving as it hovers.">
<style><![CDATA[
.ag-float{animation:ag-float 4.4s cubic-bezier(.45,0,.55,1) infinite}
.ag-shadow{transform-origin:180px 396px;animation:ag-shadow 4.4s cubic-bezier(.45,0,.55,1) infinite}
.ag-wave{transform-origin:276px 250px;animation:ag-wave 2.8s cubic-bezier(.45,0,.55,1) infinite}
.ag-eye{transform-box:fill-box;transform-origin:center;animation:ag-blink 5.2s infinite}
.ag-tip{animation:ag-tip 2.4s ease-in-out infinite}
@keyframes ag-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ag-shadow{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(.88);opacity:.38}}
@keyframes ag-wave{0%,100%{transform:rotate(0)}20%{transform:rotate(-26deg)}35%{transform:rotate(-12deg)}50%{transform:rotate(-26deg)}70%{transform:rotate(0)}}
@keyframes ag-blink{0%,90%,100%{transform:scaleY(1)}93%,95%{transform:scaleY(.12)}}
@keyframes ag-tip{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.ag-float,.ag-shadow,.ag-wave,.ag-eye,.ag-tip{animation:none}}
]]></style>
<defs>
<radialGradient id="ag-shell" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F6F7F4"/><stop offset=".85" stop-color="#E3E6E0"/><stop offset="1" stop-color="#D3D8D0"/></radialGradient>
<radialGradient id="ag-arm" cx="35%" cy="25%" r="85%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#ECEEEA"/><stop offset="1" stop-color="#D6DAD3"/></radialGradient>
<linearGradient id="ag-visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34433A"/><stop offset=".5" stop-color="#1C2620"/><stop offset="1" stop-color="#121914"/></linearGradient>
<linearGradient id="ag-panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6F3DF"/><stop offset="1" stop-color="#BFDDB1"/></linearGradient>
<linearGradient id="ag-ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDF0D4"/><stop offset="1" stop-color="#A9CF9B"/></linearGradient>
<radialGradient id="ag-ball" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E4F2DD"/><stop offset="1" stop-color="#B9D9AB"/></radialGradient>
<radialGradient id="ag-ground" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2C3A30" stop-opacity=".32"/><stop offset="1" stop-color="#2C3A30" stop-opacity="0"/></radialGradient>
<filter id="ag-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse class="ag-shadow" cx="180" cy="396" rx="82" ry="12" fill="url(#ag-ground)"/>
<g class="ag-float">
  <!-- far arm (left) -->
  <rect x="68" y="244" width="30" height="78" rx="15" transform="rotate(14 83 250)" fill="url(#ag-arm)" stroke="#C9CEC6" stroke-width="1.2"/>
  <!-- body -->
  <path d="M180 236c48 0 80 30 80 70 0 44-36 74-80 74s-80-30-80-74c0-40 32-70 80-70z" fill="url(#ag-shell)" stroke="#C9CEC6" stroke-width="1.2"/>
  <path d="M130 268c12-14 30-22 50-22" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <path d="M146 322c0-10 15-16 34-16s34 6 34 16c0 14-15 24-34 24s-34-10-34-24z" fill="url(#ag-panel)" stroke="#A9C99C" stroke-width="1.2"/>
  <path d="M156 318c6-4 14-6 24-6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- near arm (right), waving -->
  <g class="ag-wave"><rect x="262" y="244" width="30" height="78" rx="15" transform="rotate(-14 277 250)" fill="url(#ag-arm)" stroke="#C9CEC6" stroke-width="1.2"/></g>
  <!-- head -->
  <circle cx="180" cy="168" r="88" fill="url(#ag-shell)" stroke="#C9CEC6" stroke-width="1.2"/>
  <path d="M112 128c14-28 40-44 70-46" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".95"/>
  <!-- antenna -->
  <rect x="175" y="62" width="10" height="26" rx="5" fill="url(#ag-arm)" stroke="#C9CEC6" stroke-width="1.2"/>
  <ellipse cx="180" cy="84" rx="30" ry="9" fill="url(#ag-ring)" stroke="#9CC38D" stroke-width="1.2"/>
  <ellipse cx="180" cy="82" rx="16" ry="4" fill="#C9E4BE"/>
  <g class="ag-tip"><circle cx="180" cy="54" r="13" fill="url(#ag-ball)" stroke="#A9CF9B" stroke-width="1.2"/><circle cx="175" cy="49" r="4" fill="#FFFFFF" opacity=".9"/></g>
  <!-- visor -->
  <rect x="106" y="132" width="148" height="80" rx="38" fill="url(#ag-visor)"/>
  <path d="M128 142h104" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".12"/>
  <!-- eyes -->
  <g filter="url(#ag-glow)" fill="#9BEA82">
    <ellipse class="ag-eye" cx="150" cy="172" rx="12" ry="14"/>
    <ellipse class="ag-eye" cx="210" cy="172" rx="12" ry="14"/>
  </g>
  <ellipse class="ag-eye" cx="146" cy="166" rx="3.4" ry="4" fill="#F2FFEC" opacity=".9"/>
  <ellipse class="ag-eye" cx="206" cy="166" rx="3.4" ry="4" fill="#F2FFEC" opacity=".9"/>
</g>
</svg>
