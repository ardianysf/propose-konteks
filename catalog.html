<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/konteks/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konteks Design System</title>
    <script>
      // Same pre-paint theme stamp as index.html so the catalog shell never
      // flashes the wrong theme on reload (keep in sync with src/theme.ts).
      ;(function () {
        try {
          var raw = window.localStorage.getItem('konteks-theme')
          var pref = raw === 'light' || raw === 'dark' || raw === 'system' ? raw : 'system'
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref
          document.documentElement.dataset.theme = resolved
        } catch (e) {
          /* storage unavailable — default light :root tokens apply */
        }
      })()
    </script>
  </head>
  <body>
    <!--
      KONTEKS CATALOG SHELL — DIRECTION CONTRACT (seed 0f0acb7e, kind: pick)
      THESIS: A procurement-grade industrial parts book — every component a machined part
      with a part number, spec rows, and precision rules; refuses the sidebar-plus-cards
      Storybook default.
      OWN-WORLD: Parts-book structure rides the production --kx-* tokens — matcha
      canvas, ink hairlines and 2px rules, accent-solid-aa as the action/active
      accent, secondary ink for references; DM Sans display numerals, mono part
      numbers, ruler ticks and registration marks; light and dark as one change of
      light (both themes inherited from tokens.css, no catalog-side overrides).
      STORY: A visitor opens the index spread, reads the giant counters, scans the domain
      table, and enters a datasheet — convinced the system is real, precise, adoptable.
      FIRST VIEWPORT: Left identity column (masthead, stacked title, 35/8/35/2 counter
      stack, intro, SOURCE-FIRST stamp) beside the full-width domain index table; footer
      band carries navigation.
      FORM: Industrial parts catalog, candidate 2 of 7, chosen by the user as model-pick;
      comp A "Index Spread" approved 2026-08-29.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
      Component previews keep production --kx-* tokens in both themes (owner constraint).
    -->
    <div id="root"></div>
    <script type="module" src="/src/catalog/main.tsx"></script>
  </body>
</html>
